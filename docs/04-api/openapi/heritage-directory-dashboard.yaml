          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, default: "displayOrder,asc" }
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OutstandingMemberResponse' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
              example:
                success: true
                data:
                  - id: "444e4567-e89b-12d3-a456-426614174666"
