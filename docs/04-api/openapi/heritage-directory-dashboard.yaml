                  personId: "123e4567-e89b-12d3-a456-426614174000"
                  fullName: "Nguyễn Văn C"
                  achievement: "Đậu thủ khoa đại học"
                  displayOrder: 2
                  createdAt: "2026-10-09T16:00:00Z"
                  updatedAt: "2026-10-09T16:00:00Z"
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenErrors' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /heritage/outstanding-members/{id}:
    patch:
      tags: [Heritage]
      summary: "Sửa người tiêu biểu (UC-HER-04)"
      operationId: updateOutstandingMember
      x-roles: [BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOutstandingMemberRequest' }
            example:
              displayOrder: 1
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/OutstandingMemberResponse' }
              example:
                success: true
                data:
                  id: "444e4567-e89b-12d3-a456-426614174666"
                  personId: "123e4567-e89b-12d3-a456-426614174000"
                  fullName: "Nguyễn Văn C"
                  achievement: "Đậu thủ khoa đại học"
                  displayOrder: 1
                  createdAt: "2026-10-09T16:00:00Z"
                  updatedAt: "2026-10-09T16:30:00Z"
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenErrors' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Heritage]
      summary: "Xóa người tiêu biểu (UC-HER-04)"
      operationId: deleteOutstandingMember
      x-roles: [BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: "Xóa thành công"
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenErrors' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /dashboard/statistics:
    get:
      tags: [Dashboard]
      summary: "Lấy chỉ số thống kê (UC-DSH-01)"
      operationId: getDashboardStats
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/DashboardStatisticsData' }
              example:
                success: true
                data:
                  totalMembers: 128
                  generationStats:
                    - generation: 1
                      count: 2
                    - generation: 2
                      count: 10
                  genderStats:
                    MALE: 68
                    FEMALE: 60
                    OTHER: 0
                  professionStats:
                    - jobTitle: "Kỹ sư"
                      count: 15
                  locationStats:
                    - location: "Hà Nội"
                      count: 45
                  weeklyPosts:
                    - weekStart: "2026-10-05T00:00:00Z"
                      postCount: 8
                  upcomingEvents:
                    - id: "555e4567-e89b-12d3-a456-426614174777"
                      title: "Lễ giỗ Tổ họ Nguyễn"
                      startAt: "2026-11-15T08:00:00Z"
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenErrors' }

  /dashboard/reports/members:
    get:
      tags: [Dashboard]
      summary: "Xuất báo cáo nhân khẩu học CSV (UC-DSH-02)"
      operationId: exportMembersCSV
      x-roles: [BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv] }
      responses:
        '200':
          description: "Tải file CSV thành công"
          headers:
            Content-Type:
              schema: { type: string, example: "text/csv; charset=UTF-8" }
            Content-Disposition:
              schema: { type: string, example: "attachment; filename=\"members-20261009.csv\"" }
          content:
            text/csv:
              schema: { type: string }
              example: "id,fullName,birthYear,gender,relationship,generation,jobTitle,workLocation\n123e4567-e89b-12d3-a456-426614174000,Nguyễn Văn An,1990,MALE,Con trai,4,Kỹ sư,Hà Nội\n5b0f2f6e-8d3a-4c1e-9a52-7e1d3c4b9a10,Nguyễn Bảo Na,2014,,Cháu nội,,,"
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenErrors' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        total: { type: integer, example: 100 }
    PersonSearchResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, example: "Nguyễn Văn An" }
        relationship: { type: string, description: "Tính qua thuật toán SCRUM-19; trẻ dưới 16 tuổi vẫn hiện", example: "Cháu đích tôn" }
        birthYear: { type: integer, example: 2012 }
        generation: { type: integer, example: 4 }
        jobTitle: { type: string, nullable: true, example: null }
        location: { type: string, nullable: true, example: null }
    ProfessionProfileRequest:
      type: object
      required: [jobTitle]
      properties:
        jobTitle: { type: string, example: "Chuyên viên dữ liệu" }
        company: { type: string, example: "FPT" }
        workLocation: { type: string, example: "Hà Nội" }
    ProfessionProfileData:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobTitle: { type: string }
        company: { type: string }
        workLocation: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EducationProfileRequest:
      type: object
      required: [school]
      properties:
        school: { type: string, example: "Đại học Bách Khoa" }
        degree: { type: string, example: "Kỹ sư" }
        graduationYear: { type: integer, example: 2024 }
    EducationProfileData:
      type: object
      properties:
        id: { type: string, format: uuid }
        school: { type: string }
        degree: { type: string }
        graduationYear: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateHeritageDocumentRequest:
      type: object
      required: [title, mediaId]
      properties:
        title: { type: string, example: "Sắc phong thời Tự Đức" }
        description: { type: string, example: "Bản sao lưu trữ" }
        category: { type: string, example: "sac-phong" }
        mediaId: { type: string, format: uuid }
    HeritageDocumentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        contentUrl: { type: string, example: "/media/123e4567-e89b-12d3-a456-426614174333/content" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateFamilyStoryRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, example: "Ký ức làng xưa" }
        content: { type: string, example: "Nội dung hồi ức..." }
        relatedPersonId: { type: string, format: uuid, nullable: true }
    FamilyStoryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        authorName: { type: string, example: "Nguyễn Văn Bình" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PhotoItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        mediaId: { type: string, format: uuid }
        contentUrl: { type: string, example: "/media/456e4567-e89b-12d3-a456-426614174333/content" }
        caption: { type: string }
        createdAt: { type: string, format: date-time }
    CreateOutstandingMemberRequest:
      type: object
      required: [personId, achievement]
      properties:
        personId: { type: string, format: uuid }
        achievement: { type: string, example: "Huân chương lao động" }
        displayOrder: { type: integer, default: 0 }
    UpdateOutstandingMemberRequest:
      type: object
      properties:
        achievement: { type: string }
        displayOrder: { type: integer }
    OutstandingMemberResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        fullName: { type: string, example: "Nguyễn Văn C" }
        achievement: { type: string }
        displayOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DashboardStatisticsData:
      type: object
      properties:
        totalMembers: { type: integer, example: 128 }
        generationStats:
          type: array
          items:
            type: object
            properties:
              generation: { type: integer }
              count: { type: integer }
        genderStats:
          type: object
          properties:
            MALE: { type: integer, example: 68 }
            FEMALE: { type: integer, example: 60 }
            OTHER: { type: integer, example: 0 }
        professionStats:
          type: array
          items:
            type: object
            properties:
              jobTitle: { type: string }
              count: { type: integer }
        locationStats:
          type: array
          items:
            type: object
            properties:
              location: { type: string }
              count: { type: integer }
        weeklyPosts:
          type: array
          items:
            type: object
            properties:
              weekStart: { type: string, format: date-time }
              postCount: { type: integer }
        upcomingEvents:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              startAt: { type: string, format: date-time }
    ErrorResponseBase:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
              nullable: true
  responses:
    BadRequestError:
      description: "Dữ liệu không hợp lệ"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponseBase' }
          example:
            success: false
            error:
              code: "VALID_001"
              message: "Dữ liệu yêu cầu không hợp lệ"
              details:
                - field: "title"
                  message: "Không được để trống"
    UnauthorizedError:
      description: "Chưa đăng nhập hoặc token hết hạn"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponseBase' }
          example:
            success: false
            error:
              code: "AUTH_002"
              message: "Token không hợp lệ hoặc đã hết hạn"
              details: null
    ForbiddenFamilyError:
      description: "Chưa được xác minh vào gia đình"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponseBase' }
          example:
            success: false
            error:
              code: "PERM_002"
              message: "Chưa được duyệt vào gia đình"
              details: null
    ForbiddenErrors:
      description: "Lỗi quyền thao tác (PERM_001) hoặc Chưa xác minh (PERM_002)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponseBase' }
          examples:
            ForbiddenRole:
              summary: "Không đủ quyền hoặc sai chi họ (PERM_001)"
              value:
                success: false
                error:
                 ForbiddenFamilyError:
      description: "Chưa được xác minh vào gia đình"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponseBase' }
          example:
            success: false
            error:
              code: "PERM_002"
              message: "Chưa được duyệt vào gia đình"
              details: null
    ForbiddenErrors:
      description: "Lỗi quyền thao tác (PERM_001) hoặc Chưa xác minh (PERM_002)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponseBase' }
          examples:
            ForbiddenRole:
              summary: "Không đủ quyền hoặc sai chi họ (PERM_001)"
              value:
                success: false
                error:
                  code: "PERM_001"
                  message: "Không đủ quyền truy cập tính năng này"
                  details: null
            ForbiddenFamily:
              summary: "Chưa xác minh gia đình (PERM_002)"
              value:
                success: false
                error:
                  code: "PERM_002"
                  message: "Chưa được duyệt vào gia đình"
                  details: null
  NotFoundError:
      description: "Không tìm thấy dữ liệu"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponseBase' }
          example:
            success: false
            error:
              code: "NOT_FOUND_001"
              message: "Tài nguyên không tồn tại"
              details: null
    ConflictError:
      description: "Trùng lặp dữ liệu"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponseBase' }
          example:
            success: false
            error:
              code: "HER_001"
              message: "Thành viên đã tồn tại trong danh sách tiêu biểu"
              details: null
