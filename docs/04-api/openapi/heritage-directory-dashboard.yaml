  /heritage/outstanding-members:
    get:
      tags: [Heritage]
      summary: "Danh sách người tiêu biểu (UC-HER-04)"
      operationId: getOutstandingMembers
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
