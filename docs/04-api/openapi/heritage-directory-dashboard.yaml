                  size: 20
                  total: 1
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenFamilyError' }
    post:
      tags: [Heritage]
      summary: "Thêm tài liệu (UC-HER-01)"
      operationId: createDocument
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHeritageDocumentRequest' }
            example:
              title: "Gia phả đời thứ 3"
              description: "Bản số hóa"
              category: "gia-pha"
              mediaId: "d3a85d34-4a2e-4b20-b851-d41a7d188111"
      responses:
        '201':
          description: "Tạo thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/HeritageDocumentResponse' }
              example:
                success: true
                data:
                  id: "111e4567-e89b-12d3-a456-426614174333"
                  title: "Gia phả đời thứ 3"
                  description: "Bản số hóa"
                  category: "gia-pha"
                  contentUrl: "/media/d3a85d34-4a2e-4b20-b851-d41a7d188111/content"
                  createdAt: "2026-10-09T15:00:00Z"
                  updatedAt: "2026-10-09T15:00:00Z"
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenErrors' }

