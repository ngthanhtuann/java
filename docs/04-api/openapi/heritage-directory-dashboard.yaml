      tags: [Directory]
      summary: "Cập nhật hồ sơ học vấn (UC-DIR-02)"
      operationId: updateEducationProfile
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EducationProfileRequest' }
            example:
              school: "Đại học Kinh Tế"
              degree: "Cử nhân"
              graduationYear: 2025
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/EducationProfileData' }
              example:
                success: true
                data:
                  id: "789e4567-e89b-12d3-a456-426614174222"
                  school: "Đại học Kinh Tế"
                  degree: "Cử nhân"
                  graduationYear: 2025
                  createdAt: "2026-10-09T10:00:00Z"
                  updatedAt: "2026-10-10T12:00:00Z"
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenErrors' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /heritage/documents:
