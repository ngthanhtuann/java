      summary: "Lấy danh sách tài liệu lịch sử (FR-HER-01)"
      operationId: getDocuments
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, default: "createdAt,desc" }
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HeritageDocumentResponse' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
              example:
                success: true
                data:
                  - id: "111e4567-e89b-12d3-a456-426614174333"
                    title: "Sắc phong thời vua Tự Đức"
                    description: "Bản sao lưu trữ sắc phong"
                    category: "sac-phong"
                    contentUrl: "/media/c2a85d34-4a2e-4b20-b851-d41a7d188092/content"
                    createdAt: "2026-10-09T10:00:00Z"
                    updatedAt: "2026-10-09T10:00:00Z"
                meta:
