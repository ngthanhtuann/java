openapi: 3.0.3
info:
  title: FamilyConnect - Module Heritage, Directory, Dashboard API
  version: 1.0.0
  description: "Đặc tả API OpenAPI cho module Quản lý Danh bạ, Di sản và Thống kê bảng điều khiển (SCRUM-22)."
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Directory
  - name: Heritage
  - name: Dashboard
paths:
  /directory/members:
    get:
      tags: [Directory]
      summary: "Tìm kiếm thành viên theo nghề nghiệp, nơi ở, thế hệ (UC-DIR-01)"
      operationId: searchMembers
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - name: job
          in: query
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
        - name: generation
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, default: "createdAt,desc" }
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PersonSearchResult' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
              example:
                success: true
                data:
                  - id: "123e4567-e89b-12d3-a456-426614174000"
                    fullName: "Nguyễn Văn An"
                    relationship: "Cháu đích tôn"
                    birthYear: 2012
                    generation: 4
                    jobTitle: null
                    location: null
                meta:
                  page: 0
                  size: 20
                  total: 1
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenFamilyError' }

  /directory/members/{personId}/profession-profile:
    get:
      tags: [Directory]
      summary: "Xem hồ sơ nghề nghiệp"
      operationId: getProfessionProfile
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ProfessionProfileData' }
              example:
                success: true
                data:
                  id: "456e4567-e89b-12d3-a456-426614174111"
                  jobTitle: "Kỹ sư"
                  company: "FPT"
                  workLocation: "Hà Nội"
                  createdAt: "2026-10-09T10:00:00Z"
                  updatedAt: "2026-10-09T10:00:00Z"
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenFamilyError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Directory]
      summary: "Cập nhật hồ sơ nghề nghiệp (UC-DIR-02)"
      operationId: updateProfessionProfile
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfessionProfileRequest' }
            example:
              jobTitle: "Chuyên viên dữ liệu"
              company: "Tập đoàn ABC"
              workLocation: "Đà Nẵng"
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ProfessionProfileData' }
              example:
                success: true
                data:
                  id: "456e4567-e89b-12d3-a456-426614174111"
                  jobTitle: "Chuyên viên dữ liệu"
                  company: "Tập đoàn ABC"
                  workLocation: "Đà Nẵng"
                  createdAt: "2026-10-09T10:00:00Z"
                  updatedAt: "2026-10-10T12:00:00Z"
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenErrors' }
        '404': { $ref: '#/components/responses/NotFoundError' }

