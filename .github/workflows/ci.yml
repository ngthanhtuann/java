name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: familyconnect
          POSTGRES_USER: familyconnect
          POSTGRES_PASSWORD: familyconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U familyconnect -d familyconnect"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build và chạy test
        run: mvn -B verify
        working-directory: backend
